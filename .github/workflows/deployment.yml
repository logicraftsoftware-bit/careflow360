name: Deploy CareFlow360 to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Only one process may modify the shared VPS checkout at a time.
concurrency:
  group: careflow360-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true

          script: |
            set -e

            echo "Loading Node.js from NVM..."
            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "NVM was not found at $NVM_DIR"
              exit 1
            fi

            nvm use 22
            node --version
            npm --version
            pm2 --version

            cd /var/www/careflow360

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "Missing /var/www/careflow360/.env"
              exit 1
            fi

            echo "Linking the API workspace to the production environment..."
            ln -sfn ../../.env apps/api/.env

            echo "Installing dependencies..."
            npm ci --workspace @careflow360/api --workspace @careflow360/web --include-workspace-root

            echo "Generating Prisma Client..."
            npm run db:generate

            echo "Updating database schema..."
            npm run db:push

            echo "Building application..."
            npm run build

            echo "Restarting API..."
            test -f apps/api/dist/server.js
            pm2 restart careflow360-api --update-env || pm2 start apps/api/dist/server.js \
              --name careflow360-api \
              --cwd /var/www/careflow360

            pm2 save

            echo "Verifying patient API route..."
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent http://127.0.0.1:4000/api/patient/clinics >/dev/null; then
                echo "Patient API is available"
                break
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Patient API health check failed"
                pm2 logs careflow360-api --lines 80 --nostream
                exit 1
              fi

              sleep 3
            done

            echo "Deployment completed successfully"
