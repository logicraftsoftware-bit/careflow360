name: Deploy CareFlow360 to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Only one process may modify the shared VPS checkout at a time.
concurrency:
  group: careflow360-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true

          script: |
            set -e

            echo "Loading Node.js from NVM..."
            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "NVM was not found at $NVM_DIR"
              exit 1
            fi

            nvm use 22
            node --version
            npm --version
            pm2 --version

            cd /var/www/careflow360

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "Missing /var/www/careflow360/.env"
              exit 1
            fi

            echo "Linking the API workspace to the production environment..."
            ln -sfn ../../.env apps/api/.env

            echo "Installing dependencies..."
            npm install --workspace @careflow360/api --workspace @careflow360/web \
              --include-workspace-root --no-audit --no-fund

            # Nginx serves apps/web/dist directly. Build it before API maintenance
            # so a later API restart/health-check failure cannot block web releases.
            echo "Building web application..."
            npm run build -w @careflow360/web

            echo "Generating Prisma Client..."
            npm run db:generate

            echo "Updating database schema..."
            npm run db:push

            echo "Building API..."
            npm run build -w @careflow360/api

            echo "Restarting API..."
            test -f apps/api/dist/src/server.js
            if pm2 describe careflow360-api >/dev/null 2>&1; then
              pm2 delete careflow360-api
            fi
            pm2 start /var/www/careflow360/apps/api/dist/src/server.js \
              --name careflow360-api \
              --cwd /var/www/careflow360

            # A read-only/missing PM2 dump location must not turn an otherwise
            # healthy runtime deployment red. The live health check below is
            # the authoritative success condition.
            pm2 save || echo "Warning: PM2 process list could not be persisted"

            echo "Verifying API health..."
            # Prisma may need a little time to establish its first production
            # database connection after PM2 recreates the process.
            for attempt in $(seq 1 20); do
              if curl --fail --silent http://127.0.0.1:4000/api/health >/dev/null; then
                echo "API is healthy"
                break
              fi

              if [ "$attempt" -eq 20 ]; then
                echo "API health check failed"
                pm2 logs careflow360-api --lines 80 --nostream
                exit 1
              fi

              sleep 3
            done

            echo "Deployment completed successfully"
