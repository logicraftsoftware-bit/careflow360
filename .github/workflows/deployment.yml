name: Deploy CareFlow360 to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true

          script: |
            set -e

            echo "Loading Node.js from NVM..."
            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "NVM was not found at $NVM_DIR"
              exit 1
            fi

            nvm use 22
            node --version
            npm --version
            pm2 --version

            cd /var/www/careflow360

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "Missing /var/www/careflow360/.env"
              exit 1
            fi

            echo "Linking the API workspace to the production environment..."
            ln -sfn ../../.env apps/api/.env

            echo "Installing dependencies..."
            npm ci

            echo "Generating Prisma Client..."
            npm run db:generate

            echo "Updating database schema..."
            npm run db:push

            echo "Building application..."
            npm run build

            echo "Restarting API..."
            pm2 restart careflow360-api || pm2 start apps/api/dist/server.js \
              --name careflow360-api \
              --cwd /var/www/careflow360

            pm2 save

            echo "Deployment completed successfully"
